name: C Library CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build ( ${{ matrix.os }} / ${{ matrix.compiler }} )
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04

        compiler:
          - gcc
          - clang

        exclude:
          - os: ubuntu-24.04
            compiler: gcc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get update
            sudo apt-get install -y clang
          fi

      - name: Configure CMake
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            CC=clang cmake -S . -B build
          else
            CC=gcc cmake -S . -B build
          fi

      - name: Build
        run: cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-executable
          path: build/test1
          retention-days: 1

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download test executable
        uses: actions/download-artifact@v4
        with:
          name: test-executable

      - name: Inspect executable
        run: |
          ls -l
          file test1

      - name: Run test executable
        run: |
          chmod +x ./test1
          ./test1
