name: C Library CI

on:
  push:
  pull_request:

permissions:
  contents: write

env:
  PUSH_CI_REPORT_TO_REPO: true

jobs:
  build:
    name: Build ( ${{ matrix.os }} / ${{ matrix.compiler }} )
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04

        compiler:
          - gcc
          - clang

        exclude:
          - os: ubuntu-24.04
            compiler: gcc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get update
            sudo apt-get install -y clang
          fi

      - name: Configure CMake
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            CC=clang cmake -S . -B build
          else
            CC=gcc cmake -S . -B build
          fi

      - name: Build
        run: cmake --build build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-executable
          path: build/test1
          retention-days: 1

      - name: Generate result
        if: always()
        run: |
          cat > "ci-result-${{ matrix.os }}-${{ matrix.compiler }}.md" <<EOF
          | OS | Compiler | Status |
          |---|---|---|
          | ${{ matrix.os }} | ${{ matrix.compiler }} | ${{ job.status }} |
          EOF

      - name: Upload CI result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-result-${{ matrix.os }}-${{ matrix.compiler }}
          path: "ci-result-${{ matrix.os }}-${{ matrix.compiler }}.md"
          retention-days: 1

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download test executable
        uses: actions/download-artifact@v4
        with:
          name: test-executable

      - name: Inspect executable
        run: |
          ls -l
          file test1

      - name: Run test executable
        run: |
          chmod +x ./test1
          ./test1

  report:
    name: Generate CI Report
    if: always()
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download CI results
        uses: actions/download-artifact@v4
        with:
          pattern: ci-result-*
          path: ci-results
          merge-multiple: true

      - name: Generate report markdown
        run: |
          {
            echo "# 🧪 CI Build Report"
            echo
            echo "## CI Information"
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Repository | \`${{ github.repository }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo "| Run | \`${{ github.run_number }}\` |"
            echo "| Generated | \`$(date -u '+%Y-%m-%d %H:%M:%S UTC')\` |"
            echo
            echo "## Matrix Results"
            echo
            echo "| Operating System | Compiler | Status |"
            echo "|---|---|---|"

            for file in ci-results/*.md; do
              tail -n +3 "$file"
            done
          } > CI-Report.md

      - name: Publish CI report to GITHUB_STEP_SUMMARY
        if: always()
        run: |
          cat CI-Report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit CI report to repository
        if: >
          env.PUSH_CI_REPORT_TO_REPO == 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CI-Report.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update CI report"
          git push

